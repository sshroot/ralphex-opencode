name: Build and publish

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ralphex-opencode
            dockerfile: Dockerfile
          - name: ralphex-go-opencode
            dockerfile: Dockerfile-go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          RALPHEX_VERSION="$(sed -n 's/^RALPHEX_VERSION=//p' versions.env)"
          OPENCODE_VERSION="$(sed -n 's/^OPENCODE_VERSION=//p' versions.env)"

          test -n "$RALPHEX_VERSION"
          test -n "$OPENCODE_VERSION"

          echo "RALPHEX_VERSION=$RALPHEX_VERSION" >> "$GITHUB_OUTPUT"
          echo "OPENCODE_VERSION=$OPENCODE_VERSION" >> "$GITHUB_OUTPUT"

          echo "Ralphex:  $RALPHEX_VERSION"
          echo "OpenCode: $OPENCODE_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            RALPHEX_VERSION=${{ steps.versions.outputs.RALPHEX_VERSION }}
            OPENCODE_VERSION=${{ steps.versions.outputs.OPENCODE_VERSION }}
          platforms: linux/amd64
          load: true
          tags: local/${{ matrix.name }}:test
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Test Ralphex
        run: |
          docker run --rm local/${{ matrix.name }}:test /srv/ralphex --version

      - name: Test OpenCode
        run: |
          docker run --rm local/${{ matrix.name }}:test opencode --version

      - name: Test base tools
        run: |
          docker run --rm local/${{ matrix.name }}:test git --version

      - name: Test Go toolchain
        if: matrix.name == 'ralphex-go-opencode'
        run: |
          docker run --rm local/${{ matrix.name }}:test go version
          docker run --rm local/${{ matrix.name }}:test golangci-lint --version
          docker run --rm local/${{ matrix.name }}:test goimports -h

      - name: Build and push multi-platform image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            RALPHEX_VERSION=${{ steps.versions.outputs.RALPHEX_VERSION }}
            OPENCODE_VERSION=${{ steps.versions.outputs.OPENCODE_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:${{ steps.versions.outputs.RALPHEX_VERSION }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:ralphex-${{ steps.versions.outputs.RALPHEX_VERSION }}-opencode-${{ steps.versions.outputs.OPENCODE_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/sshroot/ralphex-opencode
            org.opencontainers.image.version=${{ steps.versions.outputs.RALPHEX_VERSION }}
            org.opencontainers.image.title=${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
